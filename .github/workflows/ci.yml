name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (tag in the comment) so a
# moved or compromised tag can't run new code with the release/SVN secrets.

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.1", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: PHP syntax check
        run: find . -name '*.php' -not -path './prototype/*' -print0 | xargs -0 -n1 php -l
      - name: Demo data is valid JSON
        run: for f in $(find demo-data -name '*.json'); do php -r 'json_decode(file_get_contents($argv[1]), false, 512, JSON_THROW_ON_ERROR);' "$f" || exit 1; done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build plugin zip
        run: |
          mkdir -p build/pulsegrid-content-connector
          git archive HEAD | tar -x -C build/pulsegrid-content-connector
          cd build && zip -r ../pulsegrid-content-connector.zip pulsegrid-content-connector
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: pulsegrid-content-connector.zip
          generate_release_notes: true

  wordpress-org:
    # Pushing a tag like v0.6.2 publishes that version to WordPress.org.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Subversion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq subversion
          svn --version --quiet
      - name: Check the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' pulsegrid-content-connector.php | awk '{print $NF}')
          STABLE=$(grep -m1 '^Stable tag:' readme.txt | awk '{print $NF}')
          echo "tag=$TAG header=$HEADER stable=$STABLE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$STABLE" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must match the plugin header Version ($HEADER) and readme Stable tag ($STABLE)."
            exit 1
          fi
          echo "VERSION=$TAG" >> "$GITHUB_ENV"
      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: pulsegrid-content-connector
